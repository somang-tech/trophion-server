<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trophion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b10; --bg-2:#0e1016; --surface:#151822; --surface-2:#1b1f2b; --surface-3:#232838;
    --border:#2a2f3d; --border-soft:#1e2230; --text:#eae7de; --text-dim:#9498a8; --text-faint:#5c6175;
    --gold:#e8b84b; --gold-dim:#7a6530; --gold-lt:#fff3cf;
    --silver:#c3c9d6; --silver-dim:#5f6472; --silver-lt:#ffffff;
    --bronze:#cd7f4c; --bronze-dim:#6b4a34; --bronze-lt:#ffe1c7;
    --platinum:#6fe7c9; --danger:#e0654f;
    --font-display:'Bebas Neue','Oswald',impact,sans-serif;
    --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .wrap{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);}

  /* ---------- Header ---------- */
  header.top{border-bottom:1px solid var(--border-soft);background:linear-gradient(180deg,var(--bg-2),var(--bg));position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);}
  .top-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;flex:none;}
  .brand-name{font-family:var(--font-display);font-size:28px;letter-spacing:1.5px;line-height:1;background:linear-gradient(135deg,#fff 10%,var(--gold) 65%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand-tag{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:1.5px;text-transform:uppercase;border-left:1px solid var(--border);padding-left:10px;margin-left:2px;}
  .brand-mini{display:flex;align-items:center;gap:7px;}
  .brand-mini .brand-mark{width:20px;height:20px;}
  .brand-mini .brand-name{font-size:17px;letter-spacing:1px;}
  .top-stats{display:flex;gap:22px;font-family:var(--font-mono);}
  .top-stat{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .top-stat b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--text);}
  .top-stat span{font-size:9.5px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;}
  .steam-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .steam-row{display:flex;align-items:center;gap:8px;}
  .steam-btn{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 14px 9px 11px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s;}
  .steam-btn:hover{border-color:var(--gold-dim);background:var(--surface-3);}
  .steam-btn .dot{width:7px;height:7px;border-radius:50%;background:#4bd07c;flex:none;box-shadow:0 0 8px #4bd07caa;}
  .ghost-btn{font-family:var(--font-mono);font-size:11.5px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;}
  .ghost-btn:hover{border-color:var(--text-faint);color:var(--text);}
  .ghost-btn[disabled]{opacity:.5;cursor:default;}
  .steam-note{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:.2px;text-align:right;line-height:1.5;}
  .steam-note div{white-space:nowrap;}
  .steam-note b{color:var(--text-dim);}

  /* ---------- Login gate ---------- */
  .gate{max-width:520px;margin:100px auto;text-align:center;padding:0 16px;}
  .gate h1{font-family:var(--font-display);font-size:52px;letter-spacing:1.5px;margin:0 0 4px;background:linear-gradient(135deg,#fff 10%,var(--gold) 65%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .gate p{color:var(--text-dim);font-size:14px;line-height:1.7;}
  .gate .err{color:var(--danger);margin-top:16px;font-size:13px;}
  .gate .cta{display:inline-flex;align-items:center;gap:8px;margin-top:26px;background:var(--gold);color:#1a1204;font-weight:700;padding:12px 22px;border-radius:10px;font-size:14px;}

  /* ---------- Profile hero ---------- */
  .hero{padding-block:26px 20px;border-bottom:1px solid var(--border-soft);display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
  .avatar{width:64px;height:64px;border-radius:14px;flex:none;background:conic-gradient(from 220deg,var(--gold),#f2d78c,var(--gold),var(--bronze));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;color:#1a1204;position:relative;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--border);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .hero-id{display:flex;flex-direction:column;gap:4px;min-width:180px;}
  .hero-id .name{font-family:var(--font-display);font-size:24px;letter-spacing:.5px;}
  .hero-id .sub{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);}
  .hero-metrics{display:flex;gap:0;flex:1;flex-wrap:wrap;margin-left:auto;border-left:1px solid var(--border-soft);}
  .metric{padding:2px 20px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--border-soft);}
  .metric:last-child{border-right:none;}
  .metric b{font-family:var(--font-mono);font-size:19px;font-variant-numeric:tabular-nums;color:var(--text);}
  .metric b.gold-text{color:var(--gold);}
  .metric span{font-size:10px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;}

  /* ---------- Layout ---------- */
  .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;padding-block:22px 50px;align-items:start;}
  @media (max-width:880px){.layout{grid-template-columns:1fr;}}

  /* ---------- Left: game list ---------- */
  aside.rank{position:sticky;top:78px;}
  .rank-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 10px;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-faint);}
  .rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;}
  .rank-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;}
  .rank-item:hover{background:var(--surface);}
  .rank-item.active{background:var(--surface-2);border-color:var(--border);}
  .rank-num{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:16px;flex:none;text-align:right;font-variant-numeric:tabular-nums;}
  .rank-item.active .rank-num{color:var(--gold);}
  .rank-cover{width:30px;height:30px;border-radius:6px;flex:none;object-fit:cover;background:var(--surface-3);}
  .cover-fallback{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:#fff;}
  .rank-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .rank-info .rn{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-bar-track{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;}
  .rank-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--bronze),var(--gold));}
  .rank-pct{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);flex:none;font-variant-numeric:tabular-nums;width:32px;text-align:right;}

  /* ---------- Right: dashboard ---------- */
  .dash-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:16px;margin-bottom:20px;border-bottom:1px dashed var(--border);}
  .dash-cover{width:132px;height:62px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface-2);box-shadow:0 8px 22px -8px rgba(0,0,0,.6);font-size:26px;}
  .dash-meta{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1;}
  .dash-meta .gt{font-family:var(--font-display);font-size:28px;letter-spacing:.4px;line-height:1;text-wrap:balance;}
  .dash-meta .gd{font-size:12px;color:var(--text-dim);}
  .dash-meta .gd b{color:var(--text);font-weight:600;}
  .dash-ring-wrap{display:flex;align-items:center;gap:12px;margin-left:auto;}
  .dash-ring-num{display:flex;flex-direction:column;align-items:flex-end;}
  .dash-ring-num b{font-family:var(--font-mono);font-size:21px;font-variant-numeric:tabular-nums;}
  .dash-ring-num span{font-size:9.5px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;}

  /* 트로피 템플릿 */
  .tpl-card{position:relative;overflow:hidden;background:radial-gradient(120% 100% at 50% -10%,#1c2030,var(--bg-2) 55%);border:1px solid var(--border-soft);border-radius:20px;margin-bottom:22px;}
  .tpl-bg-wrap{position:absolute;inset:0;}
  .tpl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;filter:saturate(1.15) contrast(1.05);}
  .tpl-bg.cover-fallback{font-size:160px;opacity:.14;}
  .tpl-bg-shade{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -10%,rgba(28,32,48,.35),rgba(10,11,16,.82) 55%,rgba(8,9,13,.95));}
  .tpl-content{position:relative;z-index:1;padding:26px 24px 20px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .tpl-top{display:flex;justify-content:flex-end;align-items:center;width:100%;margin-bottom:6px;}
  .tpl-slot{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;}
  .tpl-gold{width:100%;padding-block:4px 6px;}
  .tpl-gold .tpl-medal{width:210px;height:269px;transform:rotate(-3deg);filter:drop-shadow(0 14px 26px rgba(0,0,0,.55));}
  .tpl-gold .tpl-name{font-size:21px;}
  .tpl-gold .tpl-rarity{font-size:13.5px;}
  .tpl-row2{display:flex;gap:26px;width:100%;margin-top:14px;align-items:flex-end;justify-content:center;}
  .tpl-silver,.tpl-bronze{flex:0 1 190px;min-width:0;}
  .tpl-silver .tpl-medal{width:138px;height:177px;transform:rotate(5deg);filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));}
  .tpl-bronze .tpl-medal{width:112px;height:143px;transform:rotate(-7deg);filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));}
  .tpl-silver .tpl-name{font-size:14px;}
  .tpl-bronze .tpl-name{font-size:12.5px;}
  .tpl-silver .tpl-rarity,.tpl-bronze .tpl-rarity{font-size:11px;}
  .tpl-medal{transition:transform .2s ease;}
  .tpl-rank-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--slot-color,var(--text-faint));}
  .tpl-name{font-weight:800;line-height:1.25;text-wrap:balance;}
  .tpl-game{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .tpl-rarity{font-family:var(--font-mono);font-weight:700;color:var(--slot-color,var(--text));font-variant-numeric:tabular-nums;}
  .tpl-slot.empty{opacity:.4;}
  .tpl-slot.empty .tpl-medal{transform:none;}
  .tpl-slot.empty .tpl-name{font-weight:500;color:var(--text-faint);font-family:var(--font-mono);font-size:11px;}
  .tpl-foot{margin-top:20px;padding-top:14px;border-top:1px dashed var(--border);width:100%;display:flex;justify-content:flex-end;}
  .tpl-share{font-family:var(--font-mono);font-size:11.5px;padding:9px 16px;border-radius:8px;border:1px solid var(--gold-dim);background:var(--gold);color:#1a1204;font-weight:700;cursor:pointer;}
  .tpl-share:hover{filter:brightness(1.06);}

  /* 획득한 업적 메달 랙 */
  .rack-section{margin-bottom:26px;}
  .rack-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .rack-head h3{margin:0;font-family:var(--font-display);font-size:17px;letter-spacing:.5px;font-weight:400;}
  .rack-hint{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .medal-rack{display:flex;flex-wrap:wrap;gap:16px 14px;padding:18px 16px 6px;background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;}
  .rack-item{display:flex;flex-direction:column;align-items:center;gap:6px;width:60px;text-align:center;cursor:default;}
  .rack-item .medal{width:44px;height:44px;transition:transform .15s ease;}
  .rack-item:nth-child(4n+1) .medal{transform:rotate(-9deg);}
  .rack-item:nth-child(4n+2) .medal{transform:rotate(6deg);}
  .rack-item:nth-child(4n+3) .medal{transform:rotate(-3deg);}
  .rack-item:nth-child(4n+4) .medal{transform:rotate(9deg);}
  .rack-item:hover .medal{transform:rotate(0deg) scale(1.12);}
  .rack-item span{font-size:9px;color:var(--text-faint);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px;}
  .rack-empty{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);padding:14px 4px;}

  /* 업적 목록 */
  .ach-section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .ach-section-head h3{margin:0;font-family:var(--font-display);font-size:18px;letter-spacing:.5px;font-weight:400;}
  .ach-section-hint{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);}
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .ach{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:12px;display:flex;gap:11px;position:relative;overflow:hidden;}
  .ach::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--tier-color,var(--text-faint));}
  .ach.locked{opacity:.42;}
  .ach.locked .medal{filter:grayscale(1) brightness(.7);}
  .medal{width:36px;height:36px;flex:none;}
  .ach-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;padding-right:24px;}
  .ach-name{font-size:13px;font-weight:700;line-height:1.25;}
  .ach-desc{font-size:11px;color:var(--text-dim);line-height:1.35;}
  .ach-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:5px;}
  .ach-tier{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tier-color,var(--text-faint));}
  .ach-pct{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .star-btn{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-faint);padding:0;}
  .star-btn svg{width:12px;height:12px;}
  .star-btn:hover{border-color:var(--text-faint);color:var(--text);}
  .ach.picked .star-btn{background:var(--pick-color);border-color:var(--pick-color);color:#1a1204;}
  .ach.picked{border-color:var(--pick-color);}
  .pick-badge{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--pick-color);color:#171208;font-family:var(--font-mono);font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}

  .status{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);padding:40px 0;text-align:center;}
  footer.site{text-align:center;padding-block:26px;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);border-top:1px solid var(--border-soft);}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(6,7,11,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-box{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:26px 28px;text-align:center;max-width:300px;width:100%;}
  .modal-box p{margin:0 0 20px;font-size:14.5px;color:var(--text);font-weight:600;}
  .modal-actions{display:flex;gap:10px;justify-content:center;}
  .modal-btn{padding:9px 22px;border-radius:8px;font-family:var(--font-mono);font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .modal-btn.primary{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700;}
  .modal-btn:hover{filter:brightness(1.1);}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <path d="M8 6H24V13C24 18.5 20.5 22 16 22C11.5 22 8 18.5 8 13V6Z" stroke="url(#g1)" stroke-width="2"/>
        <path d="M8 8H4V11C4 14 6 16 9 16" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 8H28V11C28 14 26 16 23 16" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 22V26" stroke="url(#g1)" stroke-width="2"/>
        <path d="M11 28H21" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
        <defs><linearGradient id="g1" x1="4" y1="6" x2="28" y2="28"><stop stop-color="#e8b84b"/><stop offset="1" stop-color="#cd7f4c"/></linearGradient></defs>
      </svg>
      <span class="brand-name">TROPHION</span>
      <span class="brand-tag">ACHIEVEMENT SHOWCASE</span>
    </div>
    <div class="top-stats" id="topStats">
      <div class="top-stat"><b id="statGames">—</b><span>Games</span></div>
      <div class="top-stat"><b id="statTrophies">—</b><span>Trophies</span></div>
      <div class="top-stat"><b id="statScore">—</b><span>Rarity Score</span></div>
    </div>
    <div class="steam-wrap" id="steamWrap"></div>
  </div>
</header>

<div id="app" class="wrap"><p class="status">…</p></div>

<footer class="site" id="footerText"></footer>

<script>
(function(){
  "use strict";

  /* ============ i18n ============ */
  var I18N = {
    ko: {
      loginBtn:'Steam으로 로그인', syncBtn:'동기화', syncing:'동기화 중…',
      steamNote1:'Steam 프로필/게임 세부정보가 "공개"로 설정되어 있어야',
      steamNote2:'업적과 이미지를 불러올 수 있어요',
      logoutConfirm:'로그아웃 하시겠습니까?', yes:'예', no:'아니오',
      gateDesc:'Steam으로 로그인하면 보유 게임과 업적을 불러와 금/은/동 트로피케이스를 만들 수 있어요.',
      heroPerfect:'완벽 클리어', heroTotal:'총 업적 수', heroAvgRarity:'평균 희귀도',
      rankHeader:'내 게임 랭킹 · 달성도순', rankCount:function(n){return n+'개';},
      achProgress:function(d,t){return d+'/'+t+' 업적';}, rarityScoreLabel:'Rarity Score',
      completion:'완료율', tplEmpty:'비어 있음',
      tplRarity:function(p){return '전세계 '+p+'%만 달성';},
      downloadBtn:'이미지 다운로드',
      rackTitle:function(g){return g+'에서 획득한 업적 메달';},
      rackHint:function(d,t){return d+'/'+t+'개 진열 중';},
      rackEmpty:'아직 이 게임에서 획득한 업적이 없어요.',
      achSectionTitle:function(g){return g+' 업적 목록';},
      achSectionHint:'★ 을 눌러 위 템플릿의 금/은/동 자리를 채워보세요',
      achAchieved:function(p){return p+'% 달성';},
      loading:'불러오는 중…',
      noGames:'아직 동기화된 게임이 없어요. 오른쪽 위 "동기화" 버튼을 눌러주세요.',
      footer:'TROPHION — 당신의 게임 여정을 증명하는 트로피 보드'
    },
    en: {
      loginBtn:'Sign in with Steam', syncBtn:'Sync', syncing:'Syncing…',
      steamNote1:'Your Steam profile & game details must be set to "Public"',
      steamNote2:'to load your achievements and images.',

  };
  var locale = 'en';

  function api(path, opts){
    return fetch(path, Object.assign({ headers:{'Content-Type':'application/json'} }, opts))
      .then(function(r){ return r.json().then(function(body){ return { ok:r.ok, status:r.status, body:body }; }); });
  }
  function resolveColor(v){ return v.indexOf('var(')===0 ? getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim() : v; }
  function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
  function hashHue(str){ var h=0; str=String(str||'?'); for(var i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h%360; }

  /* 커버 이미지 후보 URL을 순서대로 시도하고(플레이테스트 등 일부 appid는 header.jpg가
     없을 수 있어 capsule/library 이미지로 재시도), 전부 실패하면 이니셜 박스로 대체한다. */
  function onCoverError(imgEl){
    var candidates = [];
    try{ candidates = JSON.parse(imgEl.getAttribute('data-fallbacks') || '[]'); }catch(e){}
    var step = Number(imgEl.getAttribute('data-fallback-step') || '0');
    if(step < candidates.length){
      imgEl.setAttribute('data-fallback-step', String(step+1));
      imgEl.src = candidates[step];
      return;
    }
    var name = imgEl.getAttribute('data-name') || '?';
    var div = document.createElement('div');
    div.className = imgEl.className + ' cover-fallback';
    div.style.background = 'linear-gradient(155deg,hsl('+hashHue(name)+',45%,32%),#0a0b10)';
    div.textContent = name.charAt(0).toUpperCase();
    imgEl.replaceWith(div);
  }
  function coverImgAttrs(g){
    var urls = (g.coverUrls && g.coverUrls.length ? g.coverUrls.slice() : [g.coverUrl]);
    var first = urls.shift();
    return 'src="'+escAttr(first)+'" data-fallbacks="'+escAttr(JSON.stringify(urls))+'" data-fallback-step="0"';
  }
  function wireCoverFallbacks(root){
    root.querySelectorAll('img.rank-cover,img.dash-cover,img.tpl-bg').forEach(function(img){
      img.addEventListener('error', function(){ onCoverError(img); });
    });
  }
  function renderTplBg(g){
    var wrap = document.getElementById('tplBgWrap');
    if(!wrap) return;
    wrap.innerHTML = '<img class="tpl-bg" '+coverImgAttrs(g)+' data-name="'+escAttr(g.name)+'" alt="">';
    wireCoverFallbacks(wrap);
  }

  function medalSvg(tier, locked, size){
    size = size || 36;
    var c = resolveColor(TIER[tier] ? TIER[tier].color : TIER.common.color);
    if(locked){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="#20242f" stroke="#333849" stroke-width="2"/><path d="M16 20v-3a6 6 0 0112 0v3" fill="none" stroke="#5c6175" stroke-width="2.2" stroke-linecap="round"/><rect x="14" y="20" width="16" height="12" rx="2.5" fill="#2a2f3d"/></svg>';
    }
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 44 44">'+
      '<circle cx="22" cy="22" r="18" fill="'+c+'22" stroke="'+c+'" stroke-width="2"/>'+
      '<circle cx="22" cy="22" r="12" fill="none" stroke="'+c+'" stroke-width="1.4" opacity=".6"/>'+
      '<path d="M22 12l2.5 6.2 6.5.4-5 4.4 1.7 6.3L22 25.9l-5.7 3.4 1.7-6.3-5-4.4 6.5-.4z" fill="'+c+'"/>'+
    '</svg>';
  }

  /* ---- 큰 트로피 컵 SVG (금/은/동 템플릿) ----
     헤더 로고의 트로피(볼+손잡이 2개+별+기둥+받침대) 실루엣은 그대로 유지하되,
     더 뚱뚱하고 화려하게: 넓은 벌브형 볼, 장식 림밴드, 메달리온 링+별, 반짝이 포인트,
     2단 받침대, 두꺼운 손잡이로 업그레이드했다. */
  function bigTrophySvg(slot, size, empty){
    var main = empty ? '#3a3f4e' : resolveColor(slot.color);
    var dim  = empty ? '#262a37' : resolveColor(slot.dim);
    var lt   = empty ? '#5c6175' : resolveColor(slot.lt);
    var gid = 'tg-'+slot.key+(empty?'e':'');
    var rid = 'tr-'+slot.key+(empty?'e':'');
    var h = Math.round(size*1.28);
    var sparkleOp = empty ? 0 : .8;
    return '<svg width="'+size+'" height="'+h+'" viewBox="0 0 100 128" aria-hidden="true">'+
      '<defs>'+
        '<linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0" stop-color="'+lt+'"/><stop offset=".4" stop-color="'+main+'"/><stop offset="1" stop-color="'+dim+'"/>'+
        '</linearGradient>'+
        '<radialGradient id="'+rid+'" cx=".5" cy=".5" r=".5">'+
          '<stop offset="0" stop-color="'+lt+'"/><stop offset="1" stop-color="'+main+'"/>'+
        '</radialGradient>'+
      '</defs>'+
      /* 손잡이 (두껍고 크게 바깥으로 휘어지는 형태) */
      '<path d="M27 21 C6 25 5 45 23 52" fill="none" stroke="'+dim+'" stroke-width="8" stroke-linecap="round"/>'+
      '<path d="M73 21 C94 25 95 45 77 52" fill="none" stroke="'+dim+'" stroke-width="8" stroke-linecap="round"/>'+
      '<path d="M27 21 C6 25 5 45 23 52" fill="none" stroke="'+main+'" stroke-width="3" stroke-linecap="round" opacity=".6"/>'+
      '<path d="M73 21 C94 25 95 45 77 52" fill="none" stroke="'+main+'" stroke-width="3" stroke-linecap="round" opacity=".6"/>'+
      /* 볼(넓고 둥근 벌브형) */
      '<path d="M28 14 C13 14 9 35 16 47 C21 57 33 65 50 65 C67 65 79 57 84 47 C91 35 87 14 72 14 Z" fill="url(#'+gid+')" stroke="'+dim+'" stroke-width="2.2"/>'+
      /* 상단 림 밴드 */
      '<path d="M22 15 C22 10 35 7 50 7 C65 7 78 10 78 15 C78 19 65 16 50 16 C35 16 22 19 22 15 Z" fill="'+lt+'" stroke="'+dim+'" stroke-width="1.4"/>'+
      /* 메달리온 링 + 별 */
      '<circle cx="50" cy="38" r="16" fill="none" stroke="'+dim+'" stroke-width="1.8" opacity=".55"/>'+
      '<circle cx="50" cy="38" r="12.5" fill="url(#'+rid+')"/>'+
      '<path d="M50 27 L53.6 35.2 62.5 36.1 55.8 42 57.7 50.8 50 46.2 42.3 50.8 44.2 42 37.5 36.1 46.4 35.2 Z" fill="'+lt+'"/>'+
      /* 어깨 반짝이 */
      '<path d="M20 27 L21.6 30.6 25.2 31 22.4 33.4 23.2 37 20 35 16.8 37 17.6 33.4 14.8 31 18.4 30.6 Z" fill="'+lt+'" opacity="'+sparkleOp+'"/>'+
      '<path d="M80 27 L81.6 30.6 85.2 31 82.4 33.4 83.2 37 80 35 76.8 37 77.6 33.4 74.8 31 78.4 30.6 Z" fill="'+lt+'" opacity="'+sparkleOp+'"/>'+
      /* 광택 하이라이트 */
      '<ellipse cx="35" cy="32" rx="6.5" ry="15" fill="#ffffff" opacity="'+(empty?'.06':'.24')+'" transform="rotate(-8 35 32)"/>'+
      /* 목/기둥 */
      '<path d="M42 65 H58 V72 C58 75 55 76 50 76 C45 76 42 75 42 72 Z" fill="'+dim+'"/>'+
      '<rect x="45" y="76" width="10" height="16" fill="url(#'+gid+')" stroke="'+dim+'" stroke-width="1.4"/>'+
      /* 2단 받침대 */
      '<path d="M31 92 H69 L75 106 H25 Z" fill="'+dim+'" stroke="'+main+'" stroke-width="1" opacity=".95"/>'+
      '<rect x="20" y="106" width="60" height="10" rx="2.5" fill="url(#'+gid+')" stroke="'+dim+'" stroke-width="1.6"/>'+
      '<rect x="30" y="109.5" width="40" height="2.4" rx="1.2" fill="'+lt+'" opacity="'+(empty?'.15':'.45')+'"/>'+
    '</svg>';
  }

  function renderSlot(el, slot, size, g, apiName){
    if(!apiName){
      el.className='tpl-slot empty';
      el.innerHTML = '<div class="tpl-medal">'+bigTrophySvg(slot,size,true)+'</div>'+
        '<span class="tpl-rank-label">'+slot.label+'</span><span class="tpl-name">'+t('tplEmpty')+'</span>';
      return;
    }
    var a = findAchByApiName(g, apiName);
    if(!a){ renderSlot(el, slot, size, g, null); return; }
    el.className='tpl-slot';
    el.style.setProperty('--slot-color', slot.color);
    el.innerHTML = '<div class="tpl-medal">'+bigTrophySvg(slot,size,false)+'</div>'+
      '<span class="tpl-rank-label">'+slot.label+'</span>'+
      '<span class="tpl-name">'+a.displayName+'</span>'+
      '<span class="tpl-game">'+g.name+'</span>'+
      '<span class="tpl-rarity">'+t('tplRarity')(a.globalPct.toFixed(1))+'</span>';
  }
  function renderTemplate(g, byslot){
    renderSlot(document.getElementById('tplGold'),   SLOTS[0], 210, g, byslot.gold);
    renderSlot(document.getElementById('tplSilver'), SLOTS[1], 138, g, byslot.silver);
    renderSlot(document.getElementById('tplBronze'), SLOTS[2], 112, g, byslot.bronze);
  }

  function renderRack(g){
    var unlocked = g.achievements.filter(function(a){ return a.unlocked; });
    document.getElementById('rackHint').textContent = t('rackHint')(unlocked.length, g.achTotal);
    var rack = document.getElementById('medalRack');
    if(unlocked.length===0){
      rack.innerHTML = '<div class="rack-empty">'+t('rackEmpty')+'</div>';
      return;
    }
    rack.innerHTML = unlocked.map(function(a){
      return '<div class="rack-item" title="'+escAttr(a.displayName)+' — '+t('tplRarity')(a.globalPct.toFixed(1))+'">'+
        '<div class="medal">'+medalSvg(a.tier, false, 44)+'</div>'+
        '<span>'+a.displayName+'</span>'+
      '</div>';
    }).join('');
  }

  var starSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.47 5.6 6.03.55-4.58 4.03 1.37 5.92L10 14.6l-5.29 3 1.37-5.92L1.5 7.65l6.03-.55z"/></svg>';
  function renderAchievements(g){
    var slotForApiName = {};
    state.picks.forEach(function(p){ slotForApiName[p.achievementApiName] = p.slot; });

    var grid = document.getElementById('achGrid');
    grid.innerHTML = g.achievements.map(function(a){
      var slot = slotForApiName[a.apiName];
      var slotDef = slot ? SLOTS.find(function(s){return s.key===slot;}) : null;
      var cls = 'ach'+(a.unlocked?'':' locked')+(slot?' picked':'');
      var right = '';
      if(a.unlocked){
        right = slot
          ? '<button class="pick-badge" type="button" style="--pick-color:'+slotDef.color+'" data-name="'+escAttr(a.apiName)+'">'+(SLOTS.indexOf(slotDef)+1)+'</button>'
          : '<button class="star-btn" type="button" data-name="'+escAttr(a.apiName)+'" aria-label="pick">'+starSvg+'</button>';
      }
      return '<div class="'+cls+'" style="--tier-color:'+(TIER[a.tier]?TIER[a.tier].color:TIER.common.color)+(slotDef?';--pick-color:'+slotDef.color:'')+'">'+
        '<div class="medal">'+medalSvg(a.tier, !a.unlocked, 36)+'</div>'+
        '<div class="ach-body">'+
          '<div class="ach-name">'+a.displayName+'</div>'+
          '<div class="ach-desc">'+(a.description||'')+'</div>'+
          '<div class="ach-foot"><span class="ach-tier">'+(TIER[a.tier]?TIER[a.tier].label:'COMMON')+'</span><span class="ach-pct">'+t('achAchieved')(a.globalPct.toFixed(1))+'</span></div>'+
        '</div>'+right+
      '</div>';
    }).join('');

    grid.querySelectorAll('.star-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ pickAchievement(btn.getAttribute('data-name')); });
    });
    grid.querySelectorAll('.pick-badge').forEach(function(btn){
      btn.addEventListener('click', function(){ removePick(btn.getAttribute('data-name')); });
    });
  }

  function nextOpenSlot(){
    var used = state.picks.map(function(p){ return p.slot; });
    var open = ['gold','silver','bronze'].filter(function(s){ return used.indexOf(s) === -1; });
    return open.length ? open[0] : 'bronze';
  }
  function pickAchievement(apiName){
    var slot = nextOpenSlot();
    api('/api/trophies', { method:'POST', body: JSON.stringify({ appId: state.activeAppId, slot: slot, achievementApiName: apiName }) })
      .then(loadActiveGame);
  }
  function removePick(apiName){
    var pick = state.picks.find(function(p){ return p.achievementApiName === apiName; });
    if(!pick) return;
    api('/api/trophies?appId='+state.activeAppId+'&slot='+pick.slot, { method:'DELETE' }).then(loadActiveGame);
  }

  /* ============ 시작 ============ */
  function loadEverything(){
    Promise.all([ api('/api/games'), api('/api/games/stats') ]).then(function(results){
      var gamesRes = results[0], statsRes = results[1];
      if(!gamesRes.ok){ renderGate(gamesRes.body.message); return; }
      state.games = gamesRes.body.games.sort(function(a,b){ return b.completionPct-a.completionPct || b.rarityScore-a.rarityScore; });
      if(state.games.length === 0){
        app.innerHTML = '<p class="status">'+t('noGames')+'</p>';
        return;
      }
      renderHero(statsRes.ok ? statsRes.body : { games:state.games.length, totalTrophies:0, rarityScore:0, perfectGames:0, avgRarity:0 });
      state.activeAppId = state.games[0].appId;
      renderSidebar();
      loadActiveGame();
    });
  }

  function boot(){
    // Steam 공개 API는 계정의 클라이언트 언어 설정(한국어/영어 등)을 알려주지 않는다 —
    // 국가코드(loccountrycode)나 접속 IP로 추정해봤지만 실제 클라이언트 언어와 안 맞는
    // 경우가 많고, 그러면 업적 텍스트(한국어로 받아온 것)와 UI(영어)가 섞여서 더 지저분해진다.
    // 그래서 신뢰할 수 없는 추정 대신 전체를 영어로 고정한다 (아래 I18N.en 참고).
    locale = 'en';
    api('/auth/me').then(function(res){
      if(!res.ok || !res.body.user){
        renderSteamWrap();
        renderGate();
        return;
      }
      state.user = res.body.user;
      renderSteamWrap();
      loadEverything();
    });
  }
  boot();
})();
</script>
</body>
</html>
